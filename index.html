<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple personal library — add books and see them listed on the page.">
  <title>My Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>My Library</h1>
      <p class="tagline">A little shelf of books, kept in JavaScript.</p>
      <p class="book-count" id="book-count" aria-live="polite">0 books</p>
    </header>

    <section class="add-section" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a book</h2>
      <form id="add-book-form" novalidate>
        <div class="field">
          <label for="book-title">Title</label>
          <input type="text" id="book-title" name="title" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="book-author">Author</label>
          <input type="text" id="book-author" name="author" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="book-pages">Pages</label>
          <input type="number" id="book-pages" name="pages" min="1" step="1" inputmode="numeric" autocomplete="off" required>
        </div>
        <p class="form-errors" id="form-errors" role="alert" hidden></p>
        <div class="form-actions">
          <button type="submit" id="add-book-submit">Add to library</button>
          <button type="button" id="cancel-edit" class="button--ghost" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="library-section" aria-labelledby="library-heading">
      <h2 id="library-heading">On the shelf</h2>
      <p class="empty-state" id="empty-state">No books yet — add your first one above.</p>
      <ul class="library" id="library"></ul>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
